name: Recogida de datos

# Recogida diaria programada a las 04:17 de Madrid todo el año (GitHub sólo ejecuta el cron en la
# rama principal), manual, o al cambiar el recolector o los datos curados en una rama de trabajo
# (para su vista previa). GitHub retrasa los programados, más en las horas en punto (el 22 oct la de
# las 05:00 salió a las 10:22): por eso un minuto impar y un disparo de respaldo a las 06:47, que no
# hace nada si ya hay una recogida completa del día (scripts/frescura.mjs).
on:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/Madrid'
    - cron: '47 6 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      aa_fresca:
        description: 'Consultar Artificial Analysis aunque haya una consulta reciente (gasta cupo diario)'
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/**'
      - 'data/curated/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Comprobar si hace falta
        id: frescura
        if: github.event_name == 'schedule'
        run: node scripts/frescura.mjs >> "$GITHUB_OUTPUT"
      - name: Recoger
        if: steps.frescura.outputs.falta != 'false'
        env:
          # Clave gratuita de Artificial Analysis; sus datos se publican con el permiso de data/curated/permisos.json.
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          # Clave de OpenRouter (secreto MOLOCHSH_API_KEY), sólo para el ranking de uso (conjunto de datos CC BY 4.0); sin ella el ranking queda «sin datos».
          OPENROUTER_API_KEY: ${{ secrets.MOLOCHSH_API_KEY }}
          AA_FRESH: ${{ inputs.aa_fresca && '1' || '' }}
        run: node scripts/collect.mjs
      - name: Validar
        if: steps.frescura.outputs.falta != 'false'
        run: node scripts/validate.mjs
      - name: Publicar datos
        if: steps.frescura.outputs.falta != 'false'
        run: |
          git config user.name 'moloch-collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m "datos: recogida $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      # En main, un fallo abre (o amplía) una incidencia con la etiqueta «recogida-fallida»: GitHub la notifica
      # por correo. La siguiente recogida correcta la cierra.
      - name: Avisar del fallo
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --label recogida-fallida --state open --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Ha vuelto a fallar: $RUN_URL"
          else
            gh label create recogida-fallida --color B60205 --description 'La recogida de datos ha fallado' 2>/dev/null || true
            gh issue create --label recogida-fallida --title 'La recogida de datos ha fallado' \
              --body "La recogida de $(date -u +%Y-%m-%d) ha fallado y la web sigue con los datos anteriores. Registro: $RUN_URL"
          fi
      - name: Cerrar el aviso
        if: success() && github.ref == 'refs/heads/main' && steps.frescura.outputs.falta != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label recogida-fallida --state open --json number -q '.[].number'); do
            gh issue close "$n" --comment "Recogida correcta: $RUN_URL"
          done
