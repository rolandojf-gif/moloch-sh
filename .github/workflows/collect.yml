name: Recogida de datos

# Recogida diaria programada (GitHub sólo ejecuta el cron en la rama principal), manual,
# o al cambiar el recolector o los datos curados en una rama de trabajo (para su vista previa).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/**'
      - 'data/curated/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recoger
        env:
          # Clave gratuita de Artificial Analysis; sus datos se publican con el permiso de data/curated/permisos.json.
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node scripts/collect.mjs
      - name: Validar
        run: node scripts/validate.mjs
      - name: Publicar datos
        run: |
          git config user.name 'moloch-collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo 'Sin cambios'; exit 0; fi
          git commit -m "datos: recogida $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
