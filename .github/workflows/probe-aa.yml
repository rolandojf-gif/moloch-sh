name: Sonda AA (temporal)
# Prueba la API gratuita de Artificial Analysis con el secreto AA_API_KEY. No toca los datos ni publica puntuaciones.
on:
  push:
    branches: [probe-aa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          path: sonda
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sondear
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: node sonda/.github/probe-aa/probe.mjs
