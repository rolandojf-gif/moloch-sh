# Temporal (fase 2): sonda de fuentes. Se elimina antes de fusionar.
name: Sonda de fuentes
on:
  push:
    branches: [observatorio-fase2]
    paths: ['.github/probe/**']
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      idx: ${{ steps.n.outputs.idx }}
    steps:
      - uses: actions/checkout@v4
      - id: n
        run: echo "idx=$(grep -v '^#' .github/probe/urls.txt | grep -c . | xargs seq -s, 1 | sed 's/^/[/;s/$/]/')" >> "$GITHUB_OUTPUT"
  probe:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.list.outputs.idx) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/probe/probe.mjs ${{ matrix.i }}
        env:
          COLS: 'Status,Operational status,Company,task,Benchmark,benchmark,Source,source,Country,Owner,Users,Project,Name'
