name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL -o /tmp/z.zip https://epoch.ai/data/benchmark_data.zip; mkdir /tmp/z; unzip -q /tmp/z.zip -d /tmp/z; cat /tmp/z/README.md
          for f in terminalbench_external swe_bench_verified frontiercode_external cursorbench_external frontierswe_external; do echo "=== $f"; python3 - "$f" <<'PY'
          import csv,sys
          r=list(csv.DictReader(open(f'/tmp/z/{sys.argv[1]}.csv')))
          print(list(r[0].keys()))
          dk=[k for k in r[0] if 'date' in k.lower()]
          r.sort(key=lambda x: x.get(dk[0]) or '', reverse=True)
          for x in r[:12]: print({k:(v[:50]) for k,v in x.items() if v})
          PY
          done
