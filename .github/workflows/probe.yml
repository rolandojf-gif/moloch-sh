name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://epoch.ai/data/benchmarks.csv https://epoch.ai/data/benchmarks.zip https://epoch.ai/data/eci.csv https://epoch.ai/benchmarks/use-this-data https://artificialanalysis.ai/data-api/docs https://artificialanalysis.ai/data-api; do
            echo "=== $u"; curl -sSL -A 'Mozilla/5.0' -o /tmp/f -w '%{http_code} %{content_type} %{size_download}\n' "$u"; file /tmp/f
            if file /tmp/f | grep -qi zip; then unzip -l /tmp/f | head -40; mkdir -p /tmp/z && unzip -o -q /tmp/f -d /tmp/z && for c in /tmp/z/*.csv /tmp/z/*/*.csv; do [ -f "$c" ] && { echo "--- $c $(wc -l < "$c")"; head -3 "$c" | cut -c1-600; }; done; 
            elif file /tmp/f | grep -qi -E 'csv|text' && ! grep -qi '<html' /tmp/f; then head -4 /tmp/f | cut -c1-800;
            else python3 -c "import re,sys,html;t=open('/tmp/f',errors='ignore').read();t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);print(t[:6000])"; fi
          done
