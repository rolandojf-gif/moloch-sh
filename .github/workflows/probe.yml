name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "=== eci_scores"; curl -sSL -o /tmp/e.csv -w '%{http_code} %{size_download}\n' https://epoch.ai/data/eci_scores.csv; wc -l /tmp/e.csv; head -5 /tmp/e.csv | cut -c1-700; echo; tail -3 /tmp/e.csv | cut -c1-700
          python3 - <<'PY'
          import csv
          r=list(csv.DictReader(open('/tmp/e.csv')))
          print('COLS',list(r[0].keys()))
          for k in r[0]:
              if 'date' in k.lower(): 
                  rs=sorted(r,key=lambda x:x[k] or '',reverse=True)[:12]
                  for x in rs: print({kk:x[kk][:60] for kk in x})
                  break
          PY
          echo "=== openapi free"; curl -sSL -o /tmp/o.json -w '%{http_code} %{content_type} %{size_download}\n' https://artificialanalysis.ai/api/v2/openapi
          python3 - <<'PY'
          import json
          try:
              o=json.load(open('/tmp/o.json'))
          except Exception as e:
              print('not json', open('/tmp/o.json').read()[:300]); raise SystemExit
          for p,v in o.get('paths',{}).items():
              if 'language/models' in p: print(p, list(v.keys()))
          p=o['paths'].get('/language/models/free') or o['paths'].get('/api/v2/language/models/free')
          print(json.dumps(p)[:4000])
          comps=o.get('components',{}).get('schemas',{})
          for n,s in comps.items():
              if 'ree' in n or 'LanguageModel' in n: print(n, json.dumps(s)[:2500])
          PY
          echo "=== terms links"; curl -sSL https://artificialanalysis.ai/data-api/docs | grep -oE 'href="[^"]*(terms|legal)[^"]*"' | sort -u
