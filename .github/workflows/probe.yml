name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sSL -o /tmp/b.csv https://epoch.ai/data/benchmarks.csv
          curl -sSL -o /tmp/z.zip https://epoch.ai/data/benchmark_data.zip; unzip -l /tmp/z.zip | head -60
          python3 - <<'PY'
          import csv,collections
          r=list(csv.DictReader(open('/tmp/b.csv')))
          print(len(r))
          recent=[x for x in r if (x.get('Version release date') or '')>='2026-06-01']
          c=collections.Counter(x['task'] for x in recent)
          print('tasks among models released since 2026-06:',c.most_common(40))
          ms=collections.Counter(x['Model'] for x in recent); print(len(ms), list(ms)[:60])
          PY
