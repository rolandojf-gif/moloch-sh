name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          pip install -q pyyaml >/dev/null 2>&1
          curl -sSL -o /tmp/o.yaml https://artificialanalysis.ai/api/v2/openapi
          python3 - <<'PY'
          import yaml,json
          o=yaml.safe_load(open('/tmp/o.yaml'))
          print([p for p in o['paths'] if 'language' in p])
          p=o['paths']['/language/models/free']['get']
          print(json.dumps({k:p[k] for k in p if k!='responses'})[:1500])
          sch=p['responses']['200']['content']['application/json']['schema']
          def res(s,d=0):
              if d>6: return '...'
              if isinstance(s,dict):
                  if '$ref' in s:
                      n=s['$ref'].split('/')[-1]; return {'REF '+n: res(o['components']['schemas'][n],d+1)}
                  return {k:res(v,d+1) for k,v in s.items() if k not in ('description','example','examples')}
              if isinstance(s,list): return [res(x,d+1) for x in s]
              return s
          print(json.dumps(res(sch))[:7000])
          PY
          echo "=== terms"; sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          for u in https://artificialanalysis.ai/docs/legal/Terms-of-Use.pdf https://artificialanalysiscdn.com/legal/ProDataPlatformTerms.pdf; do curl -sSL -o /tmp/t.pdf "$u"; echo "--- $u"; pdftotext /tmp/t.pdf - | tr -s '\n ' | grep -i -B2 -A4 -E 'free|redistribut|attribution|publicly|internal' | head -60; done
