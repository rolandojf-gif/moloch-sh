name: probe
on: { push: { branches: [probe-epoch] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "=== links use-this-data"; curl -sSL https://epoch.ai/benchmarks/use-this-data | grep -oE 'href="[^"]+"' | grep -iE 'zip|csv|eci|download' | sort -u
          echo "=== links eci"; curl -sSL https://epoch.ai/benchmarks/eci | grep -oE '(href|src)="[^"]+"' | grep -iE 'zip|csv|json|data' | sort -u | head -30
          echo "=== AA attribution section"; curl -sSL https://artificialanalysis.ai/data-api/docs | python3 -c "import re,sys,html;t=sys.stdin.read();t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S);t=html.unescape(re.sub(r'<[^>]+>',' ',t));t=re.sub(r'\s+',' ',t);i=t.find('Attribution and licensing Use of');print(t[i:i+2500])"
          echo "=== AA openapi"; for u in https://artificialanalysis.ai/api/v2/openapi.json https://artificialanalysis.ai/data-api/openapi.json https://artificialanalysis.ai/openapi.json; do curl -sSL -o /tmp/o -w "$u %{http_code} %{content_type} %{size_download}\n" $u; done
          curl -sSL https://artificialanalysis.ai/data-api/docs | grep -oE 'href="[^"]*openapi[^"]*"' | sort -u
          echo "=== AA free no key"; curl -sS -w ' %{http_code}\n' https://artificialanalysis.ai/api/v2/language/models/free | head -c 400
          echo "=== AA terms"; curl -sSL https://artificialanalysis.ai/docs/legal/Terms-of-Use 2>/dev/null | head -c 100; echo
